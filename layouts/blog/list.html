{{ define "main" }}
<header class="blog-intro">
  <p class="eyebrow">Notes on research &amp; engineering</p>
  <h1>{{ .Title }}</h1>
  <p>{{ .Description }}</p>
</header>
<div class="blog-posts">
  {{ range .RegularPages.ByDate.Reverse }}
  <article class="blog-card">
    <p class="publication-meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2, 2006" }}</time> · AI4AI / Infrastructure</p>
    <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
    <p lang="{{ .Params.language }}">{{ .Params.summary }}</p>
    <a class="paper-link" href="{{ .RelPermalink }}">Read article <span aria-hidden="true">→</span></a>
  </article>
  {{ end }}
</div>
{{ end }}
